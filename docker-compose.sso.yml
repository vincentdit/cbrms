# Single sign-on overlay: adds Keycloak and switches the backend and console to it.
#   docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d --build
#   Console:  http://localhost:8086   (finance.maker / maker-dev, finance.approver / approver-dev)
#   Keycloak: http://localhost:8190   (admin / admin, realm "tirdo")
# LOCAL DEVELOPMENT ONLY: start-dev, fixed passwords and an imported realm.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: cbrms-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers and token issuers use localhost:8190; containers reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${CBRMS_SSO_PORT:-8190}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./sso/tirdo-realm.json:/opt/keycloak/data/import/tirdo-realm.json:ro
    ports:
      - "${CBRMS_SSO_PORT:-8190}:8080"
    networks:
      - cbrms-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  cbrms:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      CBRMS_SECURITY_MODE: jwt
      CBRMS_STAFF_ACR: mfa
      # Tokens must be issued by this realm (the "iss" claim browsers see) ...
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:${CBRMS_SSO_PORT:-8190}/realms/tirdo
      # ... and are verified with keys fetched over the internal network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tirdo/protocol/openid-connect/certs

  console:
    environment:
      CBRMS_AUTH_ORIGIN: http://localhost:${CBRMS_SSO_PORT:-8190}
    volumes:
      - ./frontend/config.sso.json:/usr/share/nginx/html/config.json:ro
