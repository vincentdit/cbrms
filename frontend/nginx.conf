# Same-origin setup: the browser talks only to this server (plus Keycloak in SSO mode), so no CORS is needed.
# This is an nginx template: ${CBRMS_AUTH_ORIGIN} is filled from the container environment at start-up
# (empty without single sign-on).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ${CBRMS_AUTH_ORIGIN}; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # CBRMS API, public bill lookup and (local/test only) GePG simulator
    location ~ ^/(internal|public|sim)/ {
        proxy_pass http://cbrms-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # per-client rate limits on the public lookup
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header WWW-Authenticate;    # no browser sign-in pop-up over the console
        proxy_read_timeout 60s;
    }

    # Runtime settings: never cached, so an environment can change them without a rebuild
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build files can be cached for a long time
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
