# Same-origin setup: the browser talks only to this server (plus Keycloak in SSO mode), so no CORS is needed.
# This is an nginx template: ${CBRMS_AUTH_ORIGIN} is filled from the container environment at start-up
# (empty without single sign-on).

# Public bill lookup (FR32): a first limit here, per connecting address, in front of the backend's own limits.
# If another proxy or load balancer sits in front of this server, configure real_ip (set_real_ip_from) so
# $binary_remote_addr is the client and not that proxy.
limit_req_zone $binary_remote_addr zone=cbrms_public:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Public bill lookup: same proxying, plus the edge rate limit
    location /public/ {
        limit_req zone=cbrms_public burst=10 nodelay;
        proxy_pass http://cbrms-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the backend believes this only from this proxy (cbrms.lookup.trusted-proxies)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # CBRMS API and (local/test only) GePG simulator
    location ~ ^/(internal|sim)/ {
        proxy_pass http://cbrms-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header WWW-Authenticate;    # no browser sign-in pop-up over the console
        proxy_read_timeout 60s;
    }

    # Runtime settings: never cached, so an environment can change them without a rebuild
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build files can be cached for a long time
    location ~* \.(?:js|css|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
