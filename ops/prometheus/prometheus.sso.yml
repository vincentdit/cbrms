# Prometheus for CBRMS with Keycloak: it signs in as the "monitoring" machine client (role TECHNICAL_OPERATOR).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cbrms
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: monitoring
      client_secret: monitoring-sso-dev-secret     # LOCAL DEVELOPMENT ONLY; use client_secret_file in production
      token_url: http://keycloak:8080/realms/tirdo/protocol/openid-connect/token
    static_configs:
      - targets: ["cbrms-app:8085"]
