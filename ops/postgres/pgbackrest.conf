# pgBackRest for the local CBRMS database (PostgreSQL 18 Docker image).
# LOCAL DEVELOPMENT: the repository is a Docker volume on the same machine. In production it must be on separate
# storage (another host or object storage), encrypted (repo1-cipher-type=aes-256-cbc with the passphrase in
# PGBACKREST_REPO1_CIPHER_PASS from the secret store), and a second repository is recommended.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
start-fast=y
compress-type=zst
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[cbrms]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=cbrms
pg1-socket-path=/var/run/postgresql
