spring:
  application:
    name: cbrms
  datasource:
    url: ${CBRMS_DB_URL:jdbc:postgresql://localhost:55432/cbrms}
    username: ${CBRMS_DB_USER:cbrms}
    password: ${CBRMS_DB_PASSWORD:cbrms}
  flyway:
    locations: classpath:db/migration
    connect-retries: 12            # survive a database that is still starting or briefly unreachable
    connect-retries-interval: 5s
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Only tokens issued for CBRMS ("aud" contains this value) are accepted in jwt mode.
          audiences: ${CBRMS_JWT_AUDIENCE:cbrms}

server:
  port: ${CBRMS_PORT:8085}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # p95 API latency for NFR01 (Grafana "API latency p95")

cbrms:
  gepg:
    mode: contract                      # production adapter; local and test profiles use the simulator
    provider-code: ${CBRMS_GEPG_PROVIDER:GEPG}
    ack-unknown-escalation: PT30M       # SOP-02
    control-number-escalation: PT60M    # SOP-02
  events:
    base-backoff: PT5S
    max-backoff: PT15M
    max-attempts: 12
    lease: PT1M
    batch-size: 50
    cursor-safety-window: PT2S
    http-timeout: PT10S
  billing:
    default-validity-days: 30
    max-lines: 50
    idempotency-retention: P7D
  webhook-keys: {}                      # keyId -> secret, injected from the secret store in production
  notifications:
    sender: log                         # "log" records notices without sending; replace with the SMS/email gateway adapter
  lookup:
    pepper: ${CBRMS_LOOKUP_PEPPER:local-development-pepper}   # set a long random secret in production
    # Proxies whose X-Real-IP header is believed for per-client rate limits: IPs, CIDR ranges or host names.
    # Anyone else is limited by their own connecting address, so the header cannot be used to dodge the limit.
    trusted-proxies: ${CBRMS_TRUSTED_PROXIES:cbrms-console}
  security:
    mode: ${CBRMS_SECURITY_MODE:jwt}    # jwt (Keycloak) in production; local and test profiles default to basic
    # jwt mode: staff roles count only when the token's sign-in level (acr) is one of these (comma-separated).
    # Empty = not enforced. Production and the SSO overlay use "mfa" (Keycloak level 2: password + authenticator app).
    staff-acr: ${CBRMS_STAFF_ACR:}
  ops:
    backup-expected: ${CBRMS_BACKUP_EXPECTED:false}     # true in production: a missing or stale backup raises an alert
    archive-expected: ${CBRMS_ARCHIVE_EXPECTED:false}   # true in production: WAL archive lag raises an alert
    certificates: []                                    # name + path (PEM) or name + not-after (yyyy-MM-dd)

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
