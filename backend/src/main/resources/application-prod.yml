# Production: Keycloak JWTs, contract GePG adapter, secrets from the environment or secret store.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CBRMS_OIDC_ISSUER}
  flyway:
    clean-disabled: true

cbrms:
  security:
    staff-acr: ${CBRMS_STAFF_ACR:mfa}   # Finance, approvers and auditors must sign in with an authenticator app
  ops:
    backup-expected: true
    archive-expected: true
  gepg:
    mode: contract
    provider-code: ${CBRMS_GEPG_PROVIDER}
